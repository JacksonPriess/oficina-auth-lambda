name: Build and Deploy Auth Lambda

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: ./terraform

jobs:
  build-and-terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn clean package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Ensure JWT secret value exists
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          SECRET_NAME="oficina-auth-jwt-secret"

          CURRENT_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query SecretString \
            --output text 2>/dev/null || true)

          if [ -z "$CURRENT_SECRET" ] || [ "$CURRENT_SECRET" = "None" ]; then
            echo "JWT secret ainda não possui valor. Gerando..."

            JWT_SECRET=$(openssl rand -base64 48)

            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$JWT_SECRET"

            echo "JWT secret criado com sucesso."
          else
            echo "JWT secret já possui valor. Mantendo chave existente."
          fi

      - name: Show Lambda
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          aws lambda get-function \
            --function-name oficina-auth-lambda \
            --query 'Configuration.[FunctionName,State,LastUpdateStatus]' \
            --output table